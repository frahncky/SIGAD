name: Test report redesign

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  report:
    if: github.head_ref == 'redesign-ui-completo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture remaining failures
        run: |
          set +e
          : > REMAINING_FAILURES.txt
          for file in \
            test/login_page_widget_test.dart \
            test/sprint1_flows_test.dart \
            test/widget_test.dart; do
            echo "===== $file =====" >> REMAINING_FAILURES.txt
            flutter test "$file" --reporter expanded > current_test.txt 2>&1
            code=$?
            echo "EXIT_CODE=$code" >> REMAINING_FAILURES.txt
            echo "--- FIRST ---" >> REMAINING_FAILURES.txt
            head -n 180 current_test.txt >> REMAINING_FAILURES.txt
            echo "--- LAST ---" >> REMAINING_FAILURES.txt
            tail -n 180 current_test.txt >> REMAINING_FAILURES.txt
            echo >> REMAINING_FAILURES.txt
          done
          rm -f current_test.txt
          exit 0

      - name: Commit failure report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REMAINING_FAILURES.txt
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: registra falhas restantes temporárias [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
