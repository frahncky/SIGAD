name: Test report redesign

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  report:
    if: github.head_ref == 'redesign-ui-completo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix responsive login
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/login/presentation/pages/login_page.dart')
          text = path.read_text(encoding='utf-8')

          old = '''        Wrap(
          spacing: 8,
          runSpacing: 8,
          children: UserRole.values
              .map(
                (role) => ChoiceChip(
                  avatar: Icon(_roleIcon(role), size: 18),
                  label: Text(role.displayName),
                  selected: _selectedRole == role,
                  onSelected: (_) => setState(() => _selectedRole = role),
                ),
              )
              .toList(growable: false),
        ),'''
          new = '''        LayoutBuilder(
          builder: (context, constraints) {
            final itemWidth = (constraints.maxWidth - 8) / 2;
            return Wrap(
              spacing: 8,
              runSpacing: 8,
              children: UserRole.values
                  .map(
                    (role) => SizedBox(
                      width: itemWidth,
                      child: ChoiceChip(
                        avatar: Icon(_roleIcon(role), size: 17),
                        label: Text(
                          role.displayName,
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                        ),
                        selected: _selectedRole == role,
                        onSelected: (_) =>
                            setState(() => _selectedRole = role),
                        visualDensity: VisualDensity.compact,
                      ),
                    ),
                  )
                  .toList(growable: false),
            );
          },
        ),'''
          if old not in text:
              raise SystemExit('Role selector block not found')
          text = text.replace(old, new, 1)

          old_feature = '''          Text(
            label,
            style: Theme.of(context).textTheme.bodyMedium?.copyWith(
              color: Colors.white,
              fontWeight: FontWeight.w600,
            ),
          ),'''
          new_feature = '''          Expanded(
            child: Text(
              label,
              maxLines: 2,
              overflow: TextOverflow.ellipsis,
              style: Theme.of(context).textTheme.bodyMedium?.copyWith(
                color: Colors.white,
                fontWeight: FontWeight.w600,
              ),
            ),
          ),'''
          if old_feature not in text:
              raise SystemExit('Feature line block not found')
          text = text.replace(old_feature, new_feature, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Dart format
        run: dart format lib/features/login/presentation/pages/login_page.dart

      - name: Commit login fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/login/presentation/pages/login_page.dart
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "fix: ajusta responsividade da tela de login [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run remaining tests
        run: |
          flutter test \
            test/login_page_widget_test.dart \
            test/sprint1_flows_test.dart \
            test/widget_test.dart
