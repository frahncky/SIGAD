name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix-redesign:
    if: github.event_name == 'pull_request' && github.head_ref == 'redesign-ui-completo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign-ui-completo
          fetch-depth: 0

      - name: Patch responsive login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/login/presentation/pages/login_page.dart')
          text = path.read_text(encoding='utf-8')

          old = '''        Wrap(
          spacing: 8,
          runSpacing: 8,
          children: UserRole.values
              .map(
                (role) => ChoiceChip(
                  avatar: Icon(_roleIcon(role), size: 18),
                  label: Text(role.displayName),
                  selected: _selectedRole == role,
                  onSelected: (_) => setState(() => _selectedRole = role),
                ),
              )
              .toList(growable: false),
        ),'''
          new = '''        LayoutBuilder(
          builder: (context, constraints) {
            final itemWidth = (constraints.maxWidth - 8) / 2;
            return Wrap(
              spacing: 8,
              runSpacing: 8,
              children: UserRole.values
                  .map(
                    (role) => SizedBox(
                      width: itemWidth,
                      child: ChoiceChip(
                        avatar: Icon(_roleIcon(role), size: 17),
                        label: Text(
                          role.displayName,
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                        ),
                        selected: _selectedRole == role,
                        onSelected: (_) =>
                            setState(() => _selectedRole = role),
                        visualDensity: VisualDensity.compact,
                      ),
                    ),
                  )
                  .toList(growable: false),
            );
          },
        ),'''
          if old in text:
              text = text.replace(old, new, 1)

          old_feature = '''          Text(
            label,
            style: Theme.of(context).textTheme.bodyMedium?.copyWith(
              color: Colors.white,
              fontWeight: FontWeight.w600,
            ),
          ),'''
          new_feature = '''          Expanded(
            child: Text(
              label,
              maxLines: 2,
              overflow: TextOverflow.ellipsis,
              style: Theme.of(context).textTheme.bodyMedium?.copyWith(
                color: Colors.white,
                fontWeight: FontWeight.w600,
              ),
            ),
          ),'''
          if old_feature in text:
              text = text.replace(old_feature, new_feature, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Format fix
        run: dart format lib/features/login/presentation/pages/login_page.dart

      - name: Commit responsive fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/login/presentation/pages/login_page.dart
          if git diff --cached --quiet; then
            echo "No responsive changes required."
            exit 0
          fi
          git commit -m "fix: ajusta responsividade da tela de login [skip ci]"
          git push origin HEAD:redesign-ui-completo

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
      - name: Instalar dependências
        run: flutter pub get
      - name: Análise estática
        run: flutter analyze
      - name: Rodar testes
        run: flutter test --coverage
      - name: Publicar cobertura no PR
        uses: romeovs/lcov-reporter-action@v0.2.16
        with:
          lcov-file: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
