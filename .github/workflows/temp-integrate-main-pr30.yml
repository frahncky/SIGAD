name: Temporary integrate main into PR30
on:
  push:
    branches:
      - agent/sigad-integracao-pr30

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Merge main into PR30 integration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sigad-integracao-pr30
      - name: Merge current main while retaining PR30 choices on conflicting hunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours --no-edit -m "Merge main into PR30 integration" origin/main
          git push origin HEAD:agent/sigad-integracao-pr30
