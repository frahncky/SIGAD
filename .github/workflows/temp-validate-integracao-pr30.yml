name: Temporary validate merged PR30
on:
  push:
    branches:
      - agent/sigad-integracao-pr30
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sigad-integracao-pr30
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - run: flutter pub get
      - name: Format
        run: dart format .
      - name: Static analysis
        run: flutter analyze
      - name: Run functional tests
        run: flutter test
      - name: Update visual references
        run: flutter test test/goldens/ --dart-define=RUN_GOLDEN_TESTS=true --update-goldens
      - name: Save formatting and visual references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "test: reconcile and validate PR30 after merge"
            git push origin HEAD:agent/sigad-integracao-pr30
          fi
