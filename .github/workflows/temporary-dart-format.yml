name: Temporary Dart format for SIGAD PR

on:
  push:
    branches:
      - agent/sigad-notificacoes-reais-relatorios-honestos

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sigad-notificacoes-reais-relatorios-honestos
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - run: flutter pub get
      - name: Apply standard formatting on this branch only
        run: |
          dart format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Dart formatting across SIGAD"
            git push origin HEAD:agent/sigad-notificacoes-reais-relatorios-honestos
          fi
