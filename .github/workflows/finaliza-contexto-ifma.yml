name: Finaliza contexto IFMA Monte Castelo

on:
  push:
    branches:
      - institucionalizacao-ifma-monte-castelo

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: institucionalizacao-ifma-monte-castelo
          fetch-depth: 0

      - name: Corrigir textos e dados demonstrativos
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_str, replacements):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          replace('lib/features/login/presentation/pages/login_page_v2.dart', {
              'Use suas credenciais institucionais para acessar o ambiente.':
                  'Use suas credenciais do IFMA para acessar o Campus São Luís–Monte Castelo.',
              'IFMA — Campus São Luís–Monte Castelo do IFMA — Campus São Luís–Monte Castelo.':
                  'Gestão acadêmica e departamental do IFMA — Campus São Luís–Monte Castelo.',
              'Planeje carga docente, laboratórios, reuniões, demandas e atividades com mais clareza.':
                  'Planeje as atividades do DEE: carga docente, laboratórios, reuniões e demandas.',
          })

          replace('lib/features/aulas_praticas/presentation/pages/aulas_praticas_page.dart', {
              "'Lab Automação'": "'Lab. de Automação'",
          })

          replace('lib/features/aulas_praticas/domain/reserva_service.dart', {
              "professor: 'Ismael'": "professor: 'Docente 01'",
              "professor: 'PEE - Cláudio Leão'": "professor: 'Docente 02'",
              "professor: 'Jean Mark'": "professor: 'Docente 03'",
              "professor: 'Lima'": "professor: 'Docente 04'",
          })

          replace('lib/features/configuracoes/data/configuracoes_repository.dart', {
              "'João Silva'": "'Usuário Demonstrativo'",
              "'Coordenador Acadêmico'": "'Coordenação dos Cursos do DEE'",
              "'joao.silva@universidade.edu.br'": "'usuario.demo@ifma.edu.br'",
          })

          replace('lib/features/configuracoes/domain/configuracoes_service.dart', {
              "nomePerfil: 'João Silva'": "nomePerfil: 'Usuário Demonstrativo'",
              "cargoPerfil: 'Coordenador Acadêmico'": "cargoPerfil: 'Coordenação dos Cursos do DEE'",
              "emailUsuario: 'joao.silva@universidade.edu.br'":
                  "emailUsuario: 'usuario.demo@ifma.edu.br'",
          })

          replace('lib/features/demandas/domain/demandas_service.dart', {
              "'Coordenação',": "'Coordenação dos Cursos do DEE',",
              "'TI',": "'DTI do Campus',",
              "'RH',": "'Gestão de Pessoas',",
              "'Gestão',": "'Chefia do DEE',",
              "proprietario: 'Coordenação'": "proprietario: 'Coordenação dos Cursos do DEE'",
              "proprietario: 'Gestão'": "proprietario: 'Chefia do DEE'",
          })

          replace('lib/core/services/chat_provider.dart', {
              "email: 'joao.silva@ifma.edu.br'": "email: 'professor.demo@ifma.edu.br'",
              "email: 'maria.santos@ifma.edu.br'": "email: 'coordenacao.demo@ifma.edu.br'",
              "email: 'carlos.oliveira@ifma.edu.br'": "email: 'servidor.demo@ifma.edu.br'",
              "email: 'ana.pereira@ifma.edu.br'": "email: 'chefia.demo@ifma.edu.br'",
          })

          # Atualiza testes que verificam os dados demonstrativos anteriores.
          for path in Path('test').rglob('*.dart'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('joao.silva@universidade.edu.br', 'usuario.demo@ifma.edu.br')
              text = text.replace('joao.silva@ifma.edu.br', 'professor.demo@ifma.edu.br')
              text = text.replace('maria.santos@ifma.edu.br', 'coordenacao.demo@ifma.edu.br')
              text = text.replace('carlos.oliveira@ifma.edu.br', 'servidor.demo@ifma.edu.br')
              text = text.replace('ana.pereira@ifma.edu.br', 'chefia.demo@ifma.edu.br')
              text = text.replace('Lab Automação', 'Lab. de Automação')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Formatar
        run: dart format lib test

      - name: Commitar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nenhuma correção pendente."
          else
            git commit -m "fix: consolida contexto institucional do IFMA Monte Castelo [skip ci]"
            git push origin HEAD:institucionalizacao-ifma-monte-castelo
          fi

      - name: Validar
        run: |
          flutter pub get
          flutter analyze
          flutter test
