name: Institucionaliza SIGAD para IFMA Monte Castelo

on:
  push:
    branches:
      - institucionalizacao-ifma-monte-castelo

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: institucionalizacao-ifma-monte-castelo
          fetch-depth: 0

      - name: Aplicar contexto institucional
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('lib'), Path('test'), Path('docs'), Path('README.md'), Path('ROLES_AND_PERMISSIONS.md')]
          extensions = {'.dart', '.md', '.txt', '.tsx', '.ts', '.json', '.yaml', '.yml'}

          replacements = {
              '@univ.br': '@ifma.edu.br',
              'Engenharia de Software': 'Engenharia Elétrica',
              'Sistemas de Informação': 'Telecomunicações',
              'Laboratório de Química': 'Laboratório de Eletrônica Analógica',
              'Laboratório de Biologia': 'Laboratório de Máquinas Elétricas',
              'Laboratório de Física': 'Laboratório de Medidas Elétricas',
              'Lab Química 1': 'Lab. de Eletrônica Analógica',
              'Lab Biologia 2': 'Lab. de Máquinas Elétricas',
              'Lab Física 1': 'Lab. de Medidas Elétricas',
              'Lab. Biologia': 'Lab. de Máquinas Elétricas',
              'Lab. Física': 'Lab. de Medidas Elétricas',
              'Lab. Química': 'Lab. de Eletrônica Analógica',
              'Química Orgânica': 'Eletrônica Analógica',
              'Química Geral': 'Eletrônica Digital',
              'Biologia Celular': 'Máquinas Elétricas',
              'História do Brasil': 'Instalações Elétricas',
              'Revisar inventário de microscópios': 'Revisar inventário de instrumentos de medição',
              'inventário de microscópios': 'inventário de instrumentos de medição',
              'laboratório de biologia': 'Laboratório de Máquinas Elétricas',
              'Microscopia Eletrônica': 'Eletrônica de Potência',
              'Gestão acadêmica e departamental em um único ambiente.': 'Gestão acadêmica e departamental do IFMA — Campus São Luís–Monte Castelo.',
              'Gestão acadêmica e departamental': 'IFMA — Campus São Luís–Monte Castelo',
              'Acompanhe a operação acadêmica e administrativa em um só lugar.': 'Acompanhe a gestão acadêmica do IFMA — Campus São Luís–Monte Castelo.',
              'Conversas, grupos e avisos internos do departamento.': 'Conversas, grupos e avisos internos do DEE — Campus Monte Castelo.',
              'Equipe do departamento': 'Equipe do DEE',
              'Coordenação de curso': 'Coordenação dos cursos do DEE',
              'Secretaria acadêmica': 'Secretaria Acadêmica do Campus',
              'Comissão de laboratórios': 'Comissão de Laboratórios do DEE',
          }

          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in extensions)

          for path in files:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          config = Path('lib/core/config/institutional_context.dart')
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text("""abstract final class InstitutionalContext {
            static const institution = 'Instituto Federal do Maranhão';
            static const acronym = 'IFMA';
            static const campus = 'Campus São Luís–Monte Castelo';
            static const city = 'São Luís';
            static const state = 'Maranhão';
            static const department = 'Departamento de Eletroeletrônica';
            static const departmentAcronym = 'DEE';
            static const emailDomain = 'ifma.edu.br';

            static const courses = <String>[
              'Engenharia Elétrica',
              'Técnico em Eletrônica',
              'Técnico em Eletrotécnica',
              'Técnico em Telecomunicações',
            ];

            static const laboratories = <String>[
              'Laboratório de Medidas Elétricas',
              'Laboratório de Eletrônica Analógica',
              'Laboratório de Eletrônica Digital',
              'Laboratório de Máquinas Elétricas',
              'Laboratório de Automação',
              'Laboratório de Telecomunicações',
            ];
          }
          """, encoding='utf-8')

          seed = Path('lib/features/carga_docente/data/seed_docentes.dart')
          seed.write_text("""import '../domain/docente_models.dart';
          import 'docente_repository.dart';

          /// Carga demonstrativa para testes manuais no contexto do DEE/IFMA.
          /// Os registros são fictícios e não representam servidores reais.
          Future<void> seedDocentes() async {
            final repo = DocenteRepository();
            var fallbackId = 0;
            final existentes = await repo.loadDocentes(
              generateFallbackId: () => 'seed-fallback-${fallbackId++}',
            );
            if (existentes.isNotEmpty) return;

            final docentes = [
              Docente(
                id: 'DOC-DEE-01',
                nome: 'Docente 01',
                userId: 'docente01',
                userEmail: 'docente01@ifma.edu.br',
                departamento: 'DEE — Engenharia Elétrica',
                cargaHoraria: 20,
                cargaMaxima: 20,
                disciplinas: ['Circuitos Elétricos', 'Medidas Elétricas'],
                horariosAula: const [],
              ),
              Docente(
                id: 'DOC-DEE-02',
                nome: 'Docente 02',
                userId: 'docente02',
                userEmail: 'docente02@ifma.edu.br',
                departamento: 'DEE — Eletrônica',
                cargaHoraria: 18,
                cargaMaxima: 20,
                disciplinas: ['Eletrônica Analógica', 'Eletrônica Digital'],
                horariosAula: const [],
              ),
              Docente(
                id: 'DOC-DEE-03',
                nome: 'Docente 03',
                userId: 'docente03',
                userEmail: 'docente03@ifma.edu.br',
                departamento: 'DEE — Eletrotécnica',
                cargaHoraria: 16,
                cargaMaxima: 20,
                disciplinas: ['Máquinas Elétricas', 'Instalações Elétricas'],
                horariosAula: const [],
              ),
              Docente(
                id: 'DOC-DEE-04',
                nome: 'Docente 04',
                userId: 'docente04',
                userEmail: 'docente04@ifma.edu.br',
                departamento: 'DEE — Telecomunicações',
                cargaHoraria: 14,
                cargaMaxima: 20,
                disciplinas: ['Sistemas de Comunicação', 'Redes de Telecomunicações'],
                horariosAula: const [],
              ),
              Docente(
                id: 'DOC-DEE-05',
                nome: 'Docente 05',
                userId: 'docente05',
                userEmail: 'docente05@ifma.edu.br',
                departamento: 'DEE — Automação',
                cargaHoraria: 12,
                cargaMaxima: 20,
                disciplinas: ['Automação Industrial', 'Sistemas Embarcados'],
                horariosAula: const [],
              ),
            ];
            await repo.saveDocentes(docentes);
          }
          """, encoding='utf-8')
          PY

      - name: Commitar atualização institucional
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
          else
            git commit -m "feat: adapta SIGAD ao IFMA Campus São Luís–Monte Castelo [skip ci]"
            git push origin HEAD:institucionalizacao-ifma-monte-castelo
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Instalar dependências
        run: flutter pub get

      - name: Formatar e validar
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
