name: Temporary update visual reference images

on:
  push:
    branches:
      - agent/sigad-notificacoes-reais-relatorios-honestos

permissions:
  contents: write

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sigad-notificacoes-reais-relatorios-honestos
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - run: flutter pub get
      - name: Generate reference images with deterministic time
        run: flutter test test/goldens/ --dart-define=RUN_GOLDEN_TESTS=true --update-goldens
      - name: Commit updated reference images on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u test/goldens/goldens/baselines
          if ! git diff --cached --quiet; then
            git commit -m "test: refresh visual references for current UI"
            git push origin HEAD:agent/sigad-notificacoes-reais-relatorios-honestos
          fi
