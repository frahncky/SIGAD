name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao semantica sem prefixo v (ex: 1.2.0)"
        required: true
      release_notes:
        description: "Resumo curto opcional"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGAD_ANDROID_APPLICATION_ID: ${{ vars.SIGAD_ANDROID_APPLICATION_ID }}
      SIGAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGAD_ANDROID_KEYSTORE_PASSWORD }}
      SIGAD_ANDROID_KEY_ALIAS: ${{ secrets.SIGAD_ANDROID_KEY_ALIAS }}
      SIGAD_ANDROID_KEY_PASSWORD: ${{ secrets.SIGAD_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release configuration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGAD_ANDROID_KEYSTORE_BASE64: ${{ secrets.SIGAD_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version must be X.Y.Z.'; exit 1; }
          for name in SIGAD_ANDROID_APPLICATION_ID SIGAD_ANDROID_KEYSTORE_BASE64 SIGAD_ANDROID_KEYSTORE_PASSWORD SIGAD_ANDROID_KEY_ALIAS SIGAD_ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing release configuration: $name"; exit 1; }
          done
          [[ "$SIGAD_ANDROID_APPLICATION_ID" != com.example.* ]] || { echo 'An approved institutional applicationId is required.'; exit 1; }
          umask 077
          key_path="$RUNNER_TEMP/sigad-release.keystore"
          printf '%s' "$SIGAD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          [[ -s "$key_path" ]] || { echo 'Empty signing file.'; exit 1; }
          printf 'SIGAD_ANDROID_KEYSTORE_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Validate quality gate locally
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --coverage

      - name: Bump version and changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          bash .github/scripts/bump_version_and_changelog.sh "$RELEASE_VERSION" "$RELEASE_NOTES"

      - name: Build Android AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigad-aab-v${{ github.event.inputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Commit release changes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): v$RELEASE_VERSION"

      - name: Create and push tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag "v$RELEASE_VERSION"
          git push origin HEAD
          git push origin "v$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab

      - name: Remove temporary signing file
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/sigad-release.keystore"
