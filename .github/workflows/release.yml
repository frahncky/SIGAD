name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao semantica sem prefixo v (ex: 1.2.0)"
        required: true
      release_notes:
        description: "Resumo curto opcional"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Validate quality gate locally
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --coverage

      - name: Validate production demo access lock
        run: flutter test test/login_production_mode_widget_test.dart --dart-define=SIGAD_FLAVOR=prod --dart-define=SIGAD_ENABLE_DEMO_ACCESS=true

      - name: Bump version and changelog
        run: |
          bash .github/scripts/bump_version_and_changelog.sh "${{ github.event.inputs.version }}" "${{ github.event.inputs.release_notes }}"

      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): v${{ github.event.inputs.version }}"

      - name: Create and push tag
        run: |
          git tag "v${{ github.event.inputs.version }}"
          git push origin HEAD
          git push origin "v${{ github.event.inputs.version }}"

      - name: Build Android AAB
        run: flutter build appbundle --release --dart-define=SIGAD_FLAVOR=prod --dart-define=SIGAD_ENABLE_DEMO_ACCESS=false

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigad-aab-v${{ github.event.inputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab
