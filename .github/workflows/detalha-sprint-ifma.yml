name: Detalha sprint IFMA

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  detail:
    if: github.head_ref == 'institucionalizacao-ifma-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: institucionalizacao-ifma-v2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
      - run: flutter pub get
      - name: Capturar falha
        run: |
          set +e
          flutter test test/sprint1_flows_test.dart --reporter expanded > SPRINT1_IFMA_FAILURE.txt 2>&1
          echo "EXIT_CODE=$?" >> SPRINT1_IFMA_FAILURE.txt
          exit 0
      - name: Commitar relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPRINT1_IFMA_FAILURE.txt
          git commit -m "chore: registra falha temporária do sprint IFMA [skip ci]" || exit 0
          git push origin HEAD:institucionalizacao-ifma-v2
