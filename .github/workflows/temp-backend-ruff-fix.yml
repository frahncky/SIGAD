name: Temporary backend Ruff fix
on:
  push:
    branches:
      - agent/sigad-backend-reservas-postgres
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'style(backend): ruff autofix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sigad-backend-reservas-postgres
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff>=0.11,<1.0'
      - run: ruff check --fix backend/sigad_api backend/tests
      - run: ruff format backend/sigad_api backend/tests
      - run: ruff check backend/sigad_api backend/tests
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sigad_api backend/tests
          if ! git diff --cached --quiet; then
            git commit -m 'style(backend): ruff autofix'
            git push origin HEAD:agent/sigad-backend-reservas-postgres
          fi
