name: Corrige sprint IFMA

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'institucionalizacao-ifma-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: institucionalizacao-ifma-v2
          fetch-depth: 0
      - name: Corrigir busca e filtro de laboratório
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/aulas_praticas/presentation/pages/aulas_praticas_page.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "    return DropdownButtonFormField<String>(\n      initialValue: laboratorioSelecionado,",
              "    return DropdownButtonFormField<String>(\n      isExpanded: true,\n      initialValue: laboratorioSelecionado,",
              1,
          )
          text = text.replace(
              ".map((lab) => DropdownMenuItem(value: lab, child: Text(lab)))",
              ".map(\n            (lab) => DropdownMenuItem(\n              value: lab,\n              child: Text(lab, maxLines: 1, overflow: TextOverflow.ellipsis),\n            ),\n          )",
              1,
          )
          path.write_text(text, encoding='utf-8')

          test = Path('test/sprint1_flows_test.dart')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              "      expect(find.text('Docente 02'), findsOneWidget);\n      await tester.tap(find.text('Docente 02'));",
              "      expect(find.text('Docente 02'), findsWidgets);\n      await tester.tap(find.text('Docente 02').last);",
              1,
          )
          test.write_text(text, encoding='utf-8')
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
      - run: dart format lib/features/aulas_praticas/presentation/pages/aulas_praticas_page.dart test/sprint1_flows_test.dart
      - name: Commitar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "fix: corrige filtro responsivo e fluxo docente [skip ci]" || exit 0
          git push origin HEAD:institucionalizacao-ifma-v2
      - name: Validar fluxo
        run: |
          flutter pub get
          flutter test test/sprint1_flows_test.dart
