name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Layer boundaries check
        run: bash .github/scripts/check_layer_boundaries.sh

      - name: Unit and widget tests with coverage
        run: flutter test --coverage

      - name: Coverage gate (minimum 35%)
        run: |
          line=$(grep -E '^LF:' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          hit=$(grep -E '^LH:' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum+0}')
          if [ "$line" -eq 0 ]; then
            echo "No executable lines found in coverage report"
            exit 1
          fi
          pct=$((100 * hit / line))
          echo "Coverage: ${pct}%"
          if [ "$pct" -lt 35 ]; then
            echo "Coverage gate failed: expected at least 35%"
            exit 1
          fi

      - name: Coverage gate by module
        run: |
          awk '
            BEGIN {
              current="";
            }
            /^SF:/ {
              current=substr($0,4);
              next;
            }
            /^DA:/ {
              split($0, a, ",");
              split(a[1], b, ":");
              line_hit=(a[2] > 0 ? 1 : 0);

              if (current ~ /^lib\/core\//) {
                core_total++;
                core_hit+=line_hit;
              }
              if (current ~ /^lib\/features\//) {
                features_total++;
                features_hit+=line_hit;
              }
            }
            END {
              if (core_total == 0 || features_total == 0) {
                print "Coverage gate by module failed: could not calculate module totals";
                exit 1;
              }

              core_pct=int((100 * core_hit) / core_total);
              features_pct=int((100 * features_hit) / features_total);

              print "Core coverage: " core_pct "%";
              print "Features coverage: " features_pct "%";

              if (core_pct < 35) {
                print "Core coverage gate failed: expected at least 35%";
                exit 1;
              }
              if (features_pct < 35) {
                print "Features coverage gate failed: expected at least 35%";
                exit 1;
              }
            }
          ' coverage/lcov.info

      - name: Golden tests
        run: flutter test test/goldens/ --dart-define=RUN_GOLDEN_TESTS=true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
