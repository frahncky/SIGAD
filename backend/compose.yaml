# Infraestrutura de desenvolvimento isolada. Não expor diretamente na internet.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sigad
      POSTGRES_USER: sigad
      POSTGRES_PASSWORD: ${SIGAD_DB_PASSWORD:?Defina SIGAD_DB_PASSWORD localmente}
    volumes:
      - sigad_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigad -d sigad"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  sigad_db:
