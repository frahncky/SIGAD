<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="1024" height="1024" fill="url(#grad)" rx="200"/>
  
  <!-- Circle accent -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="40"/>
  <circle cx="512" cy="512" r="350" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="30"/>
  
  <!-- Text: SIGAD -->
  <text x="512" y="580" font-family="Arial, sans-serif" font-size="280" font-weight="bold" 
        text-anchor="middle" fill="white" letter-spacing="20">
    SIGAD
  </text>
  
  <!-- Bottom accent line -->
  <rect x="250" y="680" width="524" height="8" fill="rgba(255,255,255,0.3)" rx="4"/>
</svg>
